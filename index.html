              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Graduates in the UK qualify for the 2-year Graduate Route visa. Canadian graduates receive up to 3 years of PGWP. In Australia, graduates obtain 2 to 4 years under the Subclass 485 Temporary Graduate visa."
